<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Santa Clara - Ponto de Venda móvel</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    body {
      font-family: sans-serif;
      margin: auto;
      padding: 20px;
      background-color: #f4f4f9;
      color: #333;
    }
    h1, h2, h3 {
      color: #2c3e50;
    }
    #qrcode {
      text-align: center;
      margin: 20px 0;
    }
    #botoes-produtos {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .produto-btn {
      flex: 1 1 calc(50% - 10px);
      padding: 15px;
      font-size: 2em;
      color: black;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    #botoes-produtos .produto-btn:nth-child(odd) {
      background-color: #3498db;
    }
    #botoes-produtos .produto-btn:nth-child(even) {
      background-color: #2ecc71;
    }
    .produto-btn:hover {
      opacity: 0.9;
    }
    #lista-itens div {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 5px 0;
      background-color: #ecf0f1;
      padding: 8px;
      border-radius: 5px;
      font-size: 2em;
    }
    .acoes-item {
      display: flex;
      gap: 5px;
      margin-left: auto;
    }
    .remove-produto-btn, .menos-produto-btn {
      color: white;
      border: none;
      padding: 4px 8px;
      border-radius: 3px;
      cursor: pointer;
      font-size: 0.5em;
    }
    .menos-produto-btn {
      background-color: #f39c12;
    }
    .remove-produto-btn {
      background-color: #e74c3c;
    }
    input[type="text"] {
      width: 100%;
      padding: 10px;
      font-size: 2em;
      margin-bottom: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    button {
      padding: 10px;
      margin: 5px 0;
      border-radius: 5px;
      border: none;
      font-weight: bold;
      cursor: pointer;
      font-size: 2em;
    }
    .acao-btn {
      background-color: #2ecc71;
      color: white;
      font-size: 1.5em;
    }
    .limpar-btn {
      background-color: #e67e22;
      color: white;
      font-size: 1.5em;
    }
    .limpar-tudo-btn {
      background-color: red;
      color: white;
      font-size: 0.5em;
      padding: 10px 15px;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      float: right;
      margin-top: 10px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      font-size: 2em;
    }
    th, td {
      padding: 10px;
      border: 1px solid #ccc;
      text-align: center;
    }
    #limpar-tudo-container {
      display: flex;
      justify-content: flex-end;
      margin-top: 10px;
    }
    @media (max-width: 600px) {
      #botoes-produtos {
        gap: 8px;
      }
      .produto-btn {
        flex: 1 1 calc(50% - 8px);
      }
    }
  </style>
</head>
<body>
  <h1>Santa Clara - Ponto de Venda móvel</h1>

  <h2>Produtos:</h2>
  <div id="botoes-produtos"></div>

  <div id="lista-itens"></div>

  <label for="valor">Valor (R$):</label>
  <input type="text" id="valor" inputmode="numeric" pattern="[0-9]*" placeholder="Ex: 10" />

  <button class="acao-btn" onclick="gerarQRCode()">Gerar QR Code</button>
  <button class="limpar-btn" onclick="limpar()">Limpar</button>

  <div id="qrcode"></div>

  <h2>Valores Gerados:</h2>
  <table>
    <thead>
      <tr><th>Valor</th><th>Ação</th></tr>
    </thead>
    <tbody id="corpo-tabela"></tbody>
    <tfoot>
      <tr><td>Total</td><td id="total">R$ 0,00</td></tr>
    </tfoot>
  </table>

  <button class="limpar-tudo-btn" onclick="limparTudo()">Limpar Tudo</button>
  <script>
    class Pix {
  constructor(pixKey, description, merchantName, merchantCity, txid, amount) {
    this.pixKey = pixKey;
    this.description = description;
    this.merchantName = merchantName;
    this.merchantCity = merchantCity;
    this.txid = txid;
    this.amount = amount.toFixed(2);

    this.ID_PAYLOAD_FORMAT_INDICATOR = "00";
    this.ID_MERCHANT_ACCOUNT_INFORMATION = "26";
    this.ID_MERCHANT_ACCOUNT_INFORMATION_GUI = "00";
    this.ID_MERCHANT_ACCOUNT_INFORMATION_KEY = "01";
    this.ID_MERCHANT_ACCOUNT_INFORMATION_DESCRIPTION = "02";
    this.ID_MERCHANT_CATEGORY_CODE = "52";
    this.ID_TRANSACTION_CURRENCY = "53";
    this.ID_TRANSACTION_AMOUNT = "54";
    this.ID_COUNTRY_CODE = "58";
    this.ID_MERCHANT_NAME = "59";
    this.ID_MERCHANT_CITY = "60";
    this.ID_ADDITIONAL_DATA_FIELD_TEMPLATE = "62";
    this.ID_ADDITIONAL_DATA_FIELD_TEMPLATE_TXID = "05";
    this.ID_CRC16 = "63";
  }

  _getValue(id, value) {
    const size = String(value.length).padStart(2, "0");
    return id + size + value;
  }

  _getMechantAccountInfo() {
    const gui = this._getValue(
      this.ID_MERCHANT_ACCOUNT_INFORMATION_GUI,
      "br.gov.bcb.pix"
    );
    const key = this._getValue(
      this.ID_MERCHANT_ACCOUNT_INFORMATION_KEY,
      this.pixKey
    );
    const description = this._getValue(
      this.ID_MERCHANT_ACCOUNT_INFORMATION_DESCRIPTION,
      this.description
    );

    return this._getValue(
      this.ID_MERCHANT_ACCOUNT_INFORMATION,
      gui + key + description
    );
  }

  _getAdditionalDataFieldTemplate() {
    const txid = this._getValue(
      this.ID_ADDITIONAL_DATA_FIELD_TEMPLATE_TXID,
      this.txid
    );
    return this._getValue(this.ID_ADDITIONAL_DATA_FIELD_TEMPLATE, txid);
  }

  getPayload() {
    const payload =
      this._getValue(this.ID_PAYLOAD_FORMAT_INDICATOR, "01") +
      this._getMechantAccountInfo() +
      this._getValue(this.ID_MERCHANT_CATEGORY_CODE, "0000") +
      this._getValue(this.ID_TRANSACTION_CURRENCY, "986") +
      this._getValue(this.ID_TRANSACTION_AMOUNT, this.amount) +
      this._getValue(this.ID_COUNTRY_CODE, "BR") +
      this._getValue(this.ID_MERCHANT_NAME, this.merchantName) +
      this._getValue(this.ID_MERCHANT_CITY, this.merchantCity) +
      this._getAdditionalDataFieldTemplate();

    return payload + this._getCRC16(payload);
  }

  _getCRC16(payload) {
  function ord(str) {
    return str.charCodeAt(0);
  }

  function dechex(number) {
    if (number < 0) {
      number = 0xffffffff + number + 1;
    }
    return number.toString(16).toUpperCase().padStart(4, '0');
  }

  const ID_CRC16 = "63";

  // Adiciona o ID do CRC (sem valor ainda)
  payload = payload + ID_CRC16 + "04";

  let polinomio = 0x1021;
  let resultado = 0xffff;

  for (let i = 0; i < payload.length; i++) {
    resultado ^= ord(payload[i]) << 8;
    for (let bitwise = 0; bitwise < 8; bitwise++) {
      if ((resultado <<= 1) & 0x10000) {
        resultado ^= polinomio;
      }
      resultado &= 0xffff;
    }
  }

  return ID_CRC16 + "04" + dechex(resultado);
}
}
    const produtos = [
  { nome: "Salgado", preco: 8 },
  { nome: "Pastel", preco: 10 },
  { nome: "Churrasquinho", preco: 10 },
  { nome: "Cachorro Quente", preco: 10 },
  { nome: "Lanches", preco: 16 },
  { nome: "Refrigerante", preco: 8 },
  { nome: "Caldo", preco: 15 },
  { nome: "Doces Diversos", preco: 5 },
  { nome: "Espeto de Chocolate", preco: 15 },
  { nome: "Cone", preco: 10 },
  { nome: "Maçã do Amor", preco: 7 },
  { nome: "Mini Pizza", preco: 10 },
  { nome: "Suco Tropical", preco: 8 },
  { nome: "Água", preco: 3 },
  { nome: "Água com Gás", preco: 4 },
  { nome: "Bebidas Quentes ou Vinho", preco: 7 },
  { nome: "Peixinho", preco: 6 },
  { nome: "Coca Cola 600ml", preco: 10 }
];

    let produtosSelecionados = [];
    let bloqueiaInputValor = false;
    const corpoTabela = document.getElementById("corpo-tabela");
    const totalEl = document.getElementById("total");

    window.onload = () => {
      const botoesDiv = document.getElementById("botoes-produtos");
      produtos.forEach(p => {
        const btn = document.createElement("button");
        btn.textContent = `${p.nome} - R$ ${p.preco}`;
        btn.className = "produto-btn";
        btn.onclick = () => adicionarProduto(p.nome, p.preco);
        botoesDiv.appendChild(btn);
      });
      carregarTabela();
    };

    function adicionarProduto(nome, preco) {
      if (!bloqueiaInputValor) {
        document.getElementById("valor").readOnly = true;
        bloqueiaInputValor = true;
      }
      produtosSelecionados.push({ nome, preco });
      atualizarListaProdutos();
    }

    function atualizarListaProdutos() {
    const lista = {};
    for (const p of produtosSelecionados) {
      if (!lista[p.nome]) lista[p.nome] = { preco: p.preco, qtd: 0 };
      lista[p.nome].qtd++;
    }

    const listaDiv = document.getElementById("lista-itens");
    listaDiv.innerHTML = "<h3>Produtos adicionados:</h3>";

    for (const nome in lista) {
      const item = lista[nome];
      const totalItem = item.qtd * item.preco;

      const linha = document.createElement("div");
      linha.innerHTML = `• ${nome} — ${item.qtd}x — R$ ${totalItem.toFixed(2)}`;
      linha.style.fontSize = "2em";

      const acoesDiv = document.createElement("div");
      acoesDiv.className = "acoes-item";

      const btnMenos = document.createElement("button");
      btnMenos.textContent = "-1";
      btnMenos.className = "menos-produto-btn";
      btnMenos.onclick = () => diminuirProduto(nome);

      const btnRemover = document.createElement("button");
      btnRemover.textContent = "Remover";
      btnRemover.className = "remove-produto-btn";
      btnRemover.onclick = () => removerProduto(nome);

      acoesDiv.appendChild(btnMenos);
      acoesDiv.appendChild(btnRemover);
      linha.appendChild(acoesDiv);
      listaDiv.appendChild(linha);
    }

    document.getElementById("valor").value = calcularTotalProdutos();
  }

    function diminuirProduto(nome) {
      const idx = produtosSelecionados.findIndex(p => p.nome === nome);
      if (idx >= 0) {
        produtosSelecionados.splice(idx, 1);
        atualizarListaProdutos();
      }
    }

    function removerProduto(nome) {
      produtosSelecionados = produtosSelecionados.filter(p => p.nome !== nome);
      atualizarListaProdutos();
    }

    function calcularTotalProdutos() {
      return produtosSelecionados.reduce((acc, p) => acc + p.preco, 0);
    }

    function gerarQRCode() {
      const valor = parseInt(document.getElementById("valor").value);
      if (!valor || valor <= 0) {
        alert("Informe um valor válido.");
        return;
      }

      // let pix = PIX.static()
      //                .setReceiverName('Convento Santa Clara')
      //                .setReceiverCity('Taubaté')
      //                .setKey('60520061000535')
      //                .setAmount((this.totalPrice/100)) // optional

      const chave = "60520061000535";
      const nome = "CONVENTOSANTACLARA";
      const cidade = "Taubate";
      const txid = 'QUERMESSE' + self.crypto.randomUUID().substring(0,7);
      const valorFormatado = valor.toFixed(2);
      console.log(valor);

      const payload = new Pix("60520061000535", "Festa de Santo Antonio - Fichas", "CONVENTOSANTACLARA", "TAUBATE", txid, valor);
      console.log(payload.getPayload())

      document.getElementById("qrcode").innerHTML = "";
      new QRCode(document.getElementById("qrcode"), {
        text: payload.getPayload(),
        width: 800,
        height: 800
      });

      const novaLinha = corpoTabela.insertRow();
      novaLinha.insertCell().innerText = `R$ ${valorFormatado}`;
      const botao = document.createElement("button");
      botao.textContent = "X";
      botao.className = "remove-produto-btn";
      botao.onclick = () => {
        corpoTabela.deleteRow(novaLinha.rowIndex - 1);
        salvarTabela();
        atualizarTotalTabela();
      };
      novaLinha.insertCell().appendChild(botao);
      salvarTabela();
      atualizarTotalTabela();
    }

    function salvarTabela() {
      const dados = [...corpoTabela.rows].map(r => r.cells[0].innerText);
      localStorage.setItem("valoresPIX", JSON.stringify(dados));
    }

    function carregarTabela() {
      const dados = JSON.parse(localStorage.getItem("valoresPIX") || "[]");
      corpoTabela.innerHTML = "";
      dados.forEach(valor => {
        const novaLinha = corpoTabela.insertRow();
        novaLinha.insertCell().innerText = valor;
        const botao = document.createElement("button");
        botao.textContent = "X";
        botao.className = "remove-produto-btn";
        botao.onclick = () => {
          corpoTabela.deleteRow(novaLinha.rowIndex - 1);
          salvarTabela();
          atualizarTotalTabela();
        };
        novaLinha.insertCell().appendChild(botao);
      });
      atualizarTotalTabela();
    }

    function atualizarTotalTabela() {
      const valores = [...corpoTabela.rows].map(r =>
        parseFloat(r.cells[0].innerText.replace("R$", "").replace(",", "."))
      );
      const total = valores.reduce((a, b) => a + b, 0);
      totalEl.innerText = `R$ ${total.toFixed(2)}`;
    }

    function limpar() {
      produtosSelecionados = [];
      bloqueiaInputValor = false;
      const valorInput = document.getElementById("valor");
      valorInput.value = "";
      valorInput.readOnly = false;
      document.getElementById("qrcode").innerHTML = "";
      document.getElementById("lista-itens").innerHTML = "";
    }

    function limparTudo() {
    produtosSelecionados = [];
    bloqueiaInputValor = false;
    document.getElementById("valor").value = "";
    document.getElementById("valor").readOnly = false;
    document.getElementById("qrcode").innerHTML = "";
    document.getElementById("lista-itens").innerHTML = "";
    corpoTabela.innerHTML = "";
    localStorage.removeItem("valoresPIX");
    atualizarTotalTabela();
  }
  </script>
</body>
</html>
